services:
  db:
    image: postgres:16-alpine
    container_name: lacda_db
    environment:
      POSTGRES_USER: lacda
      POSTGRES_PASSWORD: lacda_pass
      POSTGRES_DB: loans
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lacda -d loans"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: lacda_app
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data: